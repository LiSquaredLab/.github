name: Update organization activity chart

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate chart
        env:
          GITHUB_ORG: LiSquaredLab
          ORG_ACTIVITY_TOKEN: ${{ secrets.ORG_ACTIVITY_TOKEN }}
        run: python scripts/generate_org_activity.py
      - name: Commit chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/org-activity.svg assets/org-activity.json
          git diff --cached --quiet || git commit -m "Update organization activity chart"
          git push
